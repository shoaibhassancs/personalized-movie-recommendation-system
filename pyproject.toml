[project]
name = "pmrs"
version = "0.1.0"
description = "Personalized Movie Recommendation System"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I imports, N naming, UP modern syntax, B likely bugs
select = ["E", "W", "F", "I", "N", "UP", "B"]
# X, X_train, X_test follow the scikit-learn naming convention
ignore = ["N803", "N806"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas-stubs>=3.1.0.261029",
    "plotly>=7.1.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "scipy-stubs>=1.18.1,<1.19",
]

[tool.ruff.lint.per-file-ignores]
# Notebooks print long f-strings; line length is not enforced there.
"*.ipynb" = ["E501"]

[[tool.mypy.overrides]]
# scikit-learn 1.9.1 ships no type information (D-025). Its values are Any and are
# not checked by mypy; our own code around them still is.
module = "sklearn.*"
ignore_missing_imports = true
