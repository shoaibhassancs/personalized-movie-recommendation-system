[project]
name = "pmrs"
version = "0.1.0"
description = "Personalized Movie Recommendation System"
requires-python = "==3.12.*"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I imports, N naming, UP modern syntax, B likely bugs
select = ["E", "W", "F", "I", "N", "UP", "B"]
# X, X_train, X_test follow the scikit-learn naming convention
ignore = ["N803", "N806"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
